<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A visual explorer for public-domain artworks from the Art Institute of Chicago."
    />
    <title>Artic Image Room</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/index.css" />
    <script type="module" src="js/index.js"></script>
  </head>
  <body>
    <main>
      <header class="site-header">
        <a class="brand" href="/" aria-label="Artic Image Room home">AIR</a>
        <p class="eyebrow">Art Institute of Chicago</p>
        <form class="search-form" role="search">
          <label class="sr-only" for="art-search">Search artworks</label>
          <input
            id="art-search"
            name="q"
            type="search"
            placeholder="Search the collection"
            autocomplete="off"
          />
          <button type="submit">Search</button>
        </form>
      </header>

      <section class="intro" aria-labelledby="page-title">
        <p class="eyebrow">Open collection / image study</p>
        <h1 id="page-title">Art in view.</h1>
        <p>Public-domain works from the Art Institute of Chicago collection.</p>
      </section>

      <section class="gallery-section" aria-labelledby="gallery-title">
        <div class="gallery-heading">
          <h2 id="gallery-title">Collection images</h2>
          <p id="result-count" aria-live="polite">Loading works</p>
        </div>
        <div
          id="gallery"
          class="gallery"
          aria-live="polite"
          aria-busy="true"
        ></div>
        <output
          id="collection-status"
          class="status"
          aria-live="polite"
        ></output>
        <div class="load-more-wrap">
          <button id="load-more" class="load-more" type="button" hidden>
            Load more works
          </button>
        </div>
      </section>
    </main>

    <template id="artwork-template">
      <article class="artwork">
        <a class="artwork-image-link" target="_blank" rel="noreferrer">
          <img loading="lazy" alt="" />
        </a>
        <div class="artwork-info">
          <h3>Artwork title</h3>
          <p></p>
        </div>
      </article>
    </template>
  </body>
</html>
